[project]
name = "docpile-agent"
version = "0.1.0"
description = "Agentic system that owns a pile of documents end to end: understands, examines against rules, and stays alive as new documents arrive, with a human gate on every commit."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "langgraph>=0.2.20",
    "langgraph-checkpoint-sqlite>=1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
