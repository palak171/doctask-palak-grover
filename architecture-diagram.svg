<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="DocPile Agent architecture: REST API and MCP tools both call one services layer, which drives a checkpointed LangGraph pipeline (ingest, extract facts, examine, await gate); a human decides at the gate before a separate commit step applies an optimistic-concurrency compare-and-swap against the pile's version counter. A fact cache makes re-runs skip already-extracted chunks.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, Segoe UI, Roboto, sans-serif; fill: currentColor; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .accent { stroke: #d1495b; }
    .accenttext { fill: #d1495b; }
    .lbl { font-size: 12px; }
    .dim { opacity: 0.65; }
    .dashed { stroke-dasharray: 5 4; }
    .title { font-size: 15px; font-weight: 600; }
  </style>

  <!-- Surfaces -->
  <rect class="box" x="180" y="20" width="260" height="50" rx="6"/>
  <text class="lbl title" x="310" y="50" text-anchor="middle">REST API (FastAPI)</text>

  <rect class="box" x="560" y="20" width="260" height="50" rx="6"/>
  <text class="lbl title" x="690" y="50" text-anchor="middle">MCP tools</text>

  <line class="box" x1="310" y1="70" x2="470" y2="108" marker-end="url(#arrow)"/>
  <line class="box" x1="690" y1="70" x2="630" y2="108" marker-end="url(#arrow)"/>

  <!-- Services layer -->
  <rect class="box" x="300" y="110" width="600" height="50" rx="6"/>
  <text class="lbl title" x="600" y="140" text-anchor="middle">Services layer (runs · gate · commit · cost)</text>
  <text class="lbl dim" x="600" y="100" text-anchor="middle">same calls, either surface</text>

  <!-- Services -> Ingest -->
  <line class="box" x1="600" y1="160" x2="150" y2="228" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="440" y="205" text-anchor="middle">graph.invoke(thread_id=run_id)</text>

  <!-- Pipeline row -->
  <rect class="box" x="40" y="230" width="200" height="60" rx="6"/>
  <text class="lbl title" x="140" y="265" text-anchor="middle">ingest</text>

  <rect class="box" x="270" y="230" width="200" height="60" rx="6"/>
  <text class="lbl title" x="370" y="265" text-anchor="middle">extract_facts</text>

  <rect class="box" x="500" y="230" width="200" height="60" rx="6"/>
  <text class="lbl title" x="600" y="265" text-anchor="middle">examine</text>

  <rect class="box" x="730" y="230" width="200" height="60" rx="6"/>
  <text class="lbl title" x="830" y="265" text-anchor="middle">await_gate</text>

  <rect class="box accent" x="960" y="230" width="200" height="60" rx="6"/>
  <text class="lbl title accenttext" x="1060" y="265" text-anchor="middle">commit</text>

  <!-- pipeline arrows -->
  <line class="box" x1="240" y1="260" x2="270" y2="260" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="255" y="246" text-anchor="middle" font-size="10">docs</text>

  <line class="box" x1="470" y1="260" x2="500" y2="260" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="485" y="246" text-anchor="middle" font-size="10">facts</text>

  <line class="box" x1="700" y1="260" x2="730" y2="260" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="715" y="246" text-anchor="middle" font-size="10">draft</text>

  <line class="box" x1="930" y1="260" x2="960" y2="260" marker-end="url(#arrow)"/>

  <!-- Human gate -->
  <rect class="box" x="845" y="150" width="220" height="50" rx="6"/>
  <text class="lbl title" x="955" y="180" text-anchor="middle">human reviewer</text>

  <line class="box" x1="925" y1="230" x2="925" y2="200" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="895" y="218" text-anchor="end" font-size="10">pending findings</text>

  <line class="box" x1="985" y1="200" x2="1060" y2="230" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="1040" y="212" text-anchor="start" font-size="10">approve / reject, item by item</text>

  <!-- Checkpoint store -->
  <rect class="box dashed" x="360" y="430" width="280" height="50" rx="6"/>
  <text class="lbl title" x="500" y="460" text-anchor="middle">LangGraph checkpoint (SQLite file)</text>

  <line class="box dashed" x1="140" y1="290" x2="375" y2="430" marker-end="url(#arrow)"/>
  <line class="box dashed" x1="370" y1="290" x2="410" y2="430" marker-end="url(#arrow)"/>
  <line class="box dashed" x1="600" y1="290" x2="580" y2="430" marker-end="url(#arrow)"/>
  <line class="box dashed" x1="830" y1="290" x2="625" y2="430" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="500" y="500" text-anchor="middle">saved after each stage completes &#8594; a killed process resumes here; finished stages never re-run</text>

  <!-- Fact cache -->
  <rect class="box" x="40" y="540" width="260" height="60" rx="6"/>
  <text class="lbl title" x="170" y="565" text-anchor="middle">FactRecord cache</text>
  <text class="lbl dim" x="170" y="583" text-anchor="middle" font-size="10">keyed on chunk_id</text>

  <line class="box" x1="140" y1="540" x2="330" y2="292" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="180" y="420" text-anchor="middle" font-size="10">skip chunk if cached</text>

  <line class="box" x1="410" y1="292" x2="200" y2="538" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="330" y="380" text-anchor="middle" font-size="10">write facts for new chunks only</text>

  <!-- Pile version -->
  <rect class="box accent" x="900" y="540" width="260" height="60" rx="6"/>
  <text class="lbl title accenttext" x="1030" y="565" text-anchor="middle">Pile.version (int)</text>
  <text class="lbl dim" x="1030" y="583" text-anchor="middle" font-size="10">optimistic concurrency</text>

  <line class="box accent" x1="1000" y1="290" x2="960" y2="538" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="935" y="420" text-anchor="middle" font-size="10">UPDATE ... WHERE version = expected</text>

  <line class="box accent" x1="1120" y1="538" x2="1130" y2="292" marker-end="url(#arrow)"/>
  <text class="lbl dim" x="1175" y="420" text-anchor="middle" font-size="10">0 rows &#8594; conflict, caller retries</text>

  <text class="lbl dim" x="600" y="625" text-anchor="middle">Two runs racing this same compare-and-swap is exactly how concurrent commits on one pile stay non-corrupting (test_concurrency.py).</text>
</svg>
